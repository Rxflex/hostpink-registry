name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить плагины
        run: node scripts/registry.mjs --check
      - name: hostpink-registry.json собран
        run: |
          node scripts/registry.mjs
          git diff --exit-code hostpink-registry.json
